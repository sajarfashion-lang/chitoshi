<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>একলার প্রতিনিধি সাথে কথা বলতে কল করুন</title>
    <style>
        /* বেসিক রিসেট ও গ্লোবাল স্টাইল */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f4f7f6; 
            padding: 40px 20px; 
            color: #333;
        }
        
        /* হেডার স্টাইল */
        .header { 
            text-align: center; 
            margin-bottom: 40px; 
        }
        .header h1 {
            color: #1a73e8;
            font-size: 2rem;
            font-weight: 700;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }
        .header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 3px;
            background: #28a745;
            border-radius: 2px;
        }
        
        /* কন্টেইনার গ্রিড */
        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* আকর্ষণীয় কার্ড ডিজাইন */
        .card { 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 30px 20px; 
            text-align: center; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            transition: all 0.3s ease;
            border-top: 6px solid #28a745;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.12); 
        }

        /* কার্ডের ভেতরের টেক্সট স্টাইল */
        .card h3 { 
            color: #2c3e50; 
            margin-bottom: 8px; 
            font-size: 22px; 
            font-weight: 600;
        }
        
        .card .designation { 
            color: #7f8c8d; 
            margin-bottom: 15px; 
            font-size: 15px;
            font-weight: 500;
            background: #f8f9fa;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .card .phone { 
            color: #27ae60; 
            margin-bottom: 25px; 
            font-weight: 600; 
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        /* আধুনিক কল বাটন */
        .call-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            background: #28a745; 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 35px; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2);
            width: 80%;
        }

        .call-btn:hover { 
            background: #218838; 
            box-shadow: 0 6px 12px rgba(40, 167, 69, 0.3);
            transform: scale(1.03);
        }
        
        /* লোডিং স্পিনার */
        #loading { 
            text-align: center; 
            font-size: 18px; 
            color: #666; 
            font-weight: 500;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>গুরুত্বপূর্ণ এবং প্রয়োজনীয় </h1>
</div>

<div id="loading">অনুগ্রহ করে অপেক্ষা করুন, তথ্য লোড হচ্ছে...</div>
<div class="container" id="card-container"></div>

<script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsMEFdv-GlfpoS43HCgt_cuyWM6SivIru3mHTBHfVwhmWlg6wWdcVdA7mhWveAQl3c4tMVuzBpWQ4u/pub?output=csv";

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            
            // রিলিজ করা ডাটা সঠিকভাবে লাইন ব্রেক অনুযায়ী ভাগ করা
            const rows = data.split(/\r?\n/).slice(1); 
            
            const container = document.getElementById('card-container');
            const loading = document.getElementById('loading');
            loading.style.display = 'none';

            rows.forEach(row => {
                // কমা দিয়ে স্প্লিট করার ক্ষেত্রে সেফটি হ্যান্ডলিং
                const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (columns.length >= 2) {
                    const name = columns[0] ? columns[0].replace(/^"|"$/g, '').trim() : '';
                    const design = columns[1] ? columns[1].replace(/^"|"$/g, '').trim() : '';
                    const phone = columns[2] ? columns[2].replace(/^"|"$/g, '').trim() : '';

                    if(name && phone) {
                        const card = `
                            <div class="card">
                                <div>
                                    <h3> ${name}</h3>
                                    <div class="designation">${design}</div>
                                </div>
                                <div style="width: 100%;">
                                    <p class="phone">📞 ${phone}</p>
                                    <a href="tel:${phone}" class="call-btn">Call Now</a>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    }
                }
            });
        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('loading').innerText = 'দুঃখিত! তথ্য লোড করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।';
        }
    }

    fetchSheetData();
</script>

</body>
</html>
