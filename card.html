<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দরুদ শরীফ সমূহ</title>
    <style>
        /* গ্লোবাল স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* হেডার স্টাইল */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 10px;
        }

        header h1 {
            color: #0f5132;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #6c757d;
            font-size: 1rem;
        }

        /* মেইন কন্টেইনার */
        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            gap: 20px;
        }

        /* দরুদ কার্ড স্টাইল */
        .durood-card {
            background: #ffffff;
            border-left: 5px solid #198754;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .durood-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .durood-title {
            color: #198754;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 5px;
        }

        .arabic-text {
            font-size: 1.6rem;
            text-align: right;
            direction: rtl;
            margin-bottom: 15px;
            color: #2b2b2b;
            line-height: 1.8;
            font-family: 'Traditional Arabic', 'Amiri', serif;
        }

        .pronunciation {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #495057;
            line-height: 1.5;
        }

        .pronunciation strong, .meaning strong {
            color: #0f5132;
        }

        .meaning {
            font-size: 1rem;
            color: #6c757d;
            line-height: 1.5;
        }

        /* ফুটার স্টাইল */
        footer {
            margin-top: 5px;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
            width: 100%;
        }

        /* মোবাইল রেসপন্সিভনেস */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            header h1 {
                font-size: 1.6rem;
            }
            .arabic-text {
                font-size: 1.4rem;
            }
            .durood-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>দরুদ শরীফ সমূহ</h1>
        <p>আরবি, উচ্চারণ এবং অর্থসহ</p>
    </header>

    <!-- দরুদ কার্ডগুলো এখানে লোড হবে -->
    <div class="container" id="durood-container"></div>

    <footer>
        <p>&copy; 2026 Sofikul Islam. All rights reserved.</p>
    </footer>

    <script>
        // দরুদ শরীফের ডাটাবেজ (এখানে আপনি আরও দরুদ যোগ করতে পারবেন)
        const duroodData = [
            {
                title: "১. দরূদে ইব্রাহিম (নামাজের দরূদ)",
                arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
                pronunciation: "<strong>উচ্চারণ:</strong> আল্লাহুম্মা সাল্লি আলা মুহাম্মাদিওঁ ওয়া আলা আলি মুহাম্মাদিন, কামা সাল্লাইতা আলা ইব্রাহিমা ওয়া আলা আলি ইব্রাহিমা ইন্নাকা হামিদুম মাজিদ। আল্লাহুম্মা বারিক আলা মুহাম্মাদিওঁ ওয়া আলা আলি মুহাম্মাদিন, কমা বারাকতা আলা ইব্রাহিমা ওয়া আলা আলি ইব্রাহিমা ইন্নাকা হামিদুম মাজিদ।",
                meaning: "<strong>অর্থ:</strong> হে আল্লাহ! মুহাম্মদ (সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম) ও তাঁর বংশধরদের ওপর রহমত বর্ষণ করুন, যেমনটি আপনি ইব্রাহিম ও তাঁর বংশধরদের ওপর রহমত বর্ষণ করেছিলেন। নিশ্চয়ই আপনি প্রশংসিত ও সম্মানিত। হে আল্লাহ! মুহাম্মদ (সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম) ও তাঁর বংশধরদের ওপর বরকত নাজিল করুন, যেমনটি আপনি ইব্রাহিম ও তাঁর বংশধরদের ওপর বরকত নাজিল করেছিলেন। নিশ্চয়ই আপনি প্রশংসিত ও সম্মানিত।"
            },
            {
                title: "২. সংক্ষিপ্ত দরূদ শরীফ",
                arabic: "صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ",
                pronunciation: "<strong>উচ্চারণ:</strong> সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম।",
                meaning: "<strong>অর্থ:</strong> আল্লাহর শান্তি ও রহমত তাঁর (নবীজীর) ওপর বর্ষিত হোক।"
            }
        ];

        // ডাটাবেজ থেকে কার্ড তৈরি করার ফাংশন
        function displayDurood() {
            const container = document.getElementById('durood-container');
            container.innerHTML = ''; // কন্টেইনার খালি করা

            duroodData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'durood-card';

                card.innerHTML = `
                    <div class="durood-title">${item.title}</div>
                    <div class="arabic-text">${item.arabic}</div>
                    <div class="pronunciation">${item.pronunciation}</div>
                    <div class="meaning">${item.meaning}</div>
                `;

                container.appendChild(card);
            });
        }

        // পেজ লোড হলে ফাংশনটি রান করবে
        window.onload = displayDurood;
    </script>
</body>
</html>
